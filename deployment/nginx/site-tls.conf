# Rendered at container start by entrypoint.sh when ENABLE_TLS=true:
# `envsubst '$DOMAIN $ACME_EMAIL $ACME_DIRECTORY_URL'`.
acme_issuer letsencrypt {
  uri $ACME_DIRECTORY_URL;
  contact mailto:$ACME_EMAIL;
  state_path /var/lib/nginx/acme;
  accept_terms_of_service;
  # Use tls-alpn-01 (validated on 443), NOT the default http-01: in this rootless Alpine
  # nginx build the http-01 solver registers the token but never serves it on port 80 —
  # the request falls through to the static handler and 404s, so LE validation always
  # fails. tls-alpn-01 answers the challenge inside the 443 TLS handshake and works here.
  challenge tls-alpn-01;
}

server {
  listen 80;
  listen [::]:80;
  server_name $DOMAIN;

  # tls-alpn-01 is validated over 443, so port 80 only redirects http -> https.
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name $DOMAIN;

  acme_certificate letsencrypt;
  ssl_certificate       $acme_certificate;
  ssl_certificate_key   $acme_certificate_key;
  ssl_certificate_cache max=2;

  # raise once the whole chain is verified end-to-end; skip preload (one-way door)
  add_header Strict-Transport-Security "max-age=300" always;

  include /etc/nginx/locations.conf;
}
